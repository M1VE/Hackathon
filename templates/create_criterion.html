{% extends "base.html" %}

{% block content %}
<div class="page-shell page-shell--narrow">
    <div class="page-top page-top--compact">
        <div>
            <span class="section-eyebrow">{{ hackathon.title }}</span>
            <h1 class="section-title">Добавить критерий</h1>
        </div>
        <a class="btn btn-ghost" href="{% url 'manage_hackathon' hackathon.id %}">← Назад</a>
    </div>

    <form method="post" class="form panel-form">
        {% csrf_token %}
        <label>Название критерия</label>
        <input type="text" name="name" required>
        <label>Максимальный балл</label>
        <input type="number" name="max_score" value="10" required>
        <label>Вес критерия</label>
        <input type="number" step="0.1" name="weight" value="1" required>
        <div class="form-actions">
            <button class="btn btn-primary" type="submit">Сохранить</button>
        </div>
    </form>
</div>
{% endblock %}
