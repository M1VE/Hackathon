{% extends "base.html" %}

{% block content %}
<h1>Создать команду</h1>
<p style="color: #9ca3af; margin-bottom: 20px;">
    Размер команды: минимум <b style="color:#fff;">{{ min_team_size }}</b>, максимум <b style="color:#fff;">{{ max_team_size }}</b> участников.
</p>
<form method="post" class="form">
    {% csrf_token %}

    <label>Название команды</label>
    <input type="text" name="team_name" required>

    <label>Ментор</label>
    <select name="mentor">
        <option value="">Без ментора</option>

        {% for mentor in mentors %}
            <option value="{{ mentor.id }}">
                {{ mentor.full_name }} ({{ mentor.email }})
            </option>
        {% endfor %}
    </select>

    <div class="checkbox-group" style="display: flex; align-items: center; justify-content: space-between; margin: 15px 0; padding: 5px 0; cursor: pointer;">
        <label for="id_random_join" style="margin: 0; cursor: pointer; display: inline-block; width: auto; font-weight: 500; color: #e2e8f0;">
            Разрешить случайный добор участников
        </label>
        <input type="checkbox" name="is_open_for_random_join" id="id_random_join" style="width: auto; margin: 0 0 0 10px; cursor: pointer; transform: scale(1.2);">
    </div>

    <button class="btn" type="submit" style="margin-top: 20px;">
        Создать команду
    </button>
</form>
{% endblock %}
