<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Hackathon Platform</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<header class="header">
    <div class="logo">
        <a href="/">Hackathon Platform</a>
    </div>

    <nav>
        <a href="{% url 'hackathon_list' %}">Хакатоны</a>

        {% if user.is_authenticated %}
            <a href="{% url 'dashboard' %}">Кабинет</a>
            <a href="{% url 'site_logout' %}">Выйти</a>
        {% else %}
            <a href="{% url 'site_login' %}">Войти</a>
            <a href="{% url 'site_register' %}">Регистрация</a>
        {% endif %}
    </nav>
</header>

<main class="container">
    {% if messages %}
        {% for message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
</main>

</body>
</html>
