{% extends "base.html" %}

{% block content %}
<h1>Вступить в команду по invite code</h1>

<div class="card">
    <p><b>Хакатон:</b> {{ hackathon.title }}</p>
</div>

<form method="post" class="form">
    {% csrf_token %}

    <label>Invite code</label>
    <input type="text" name="invite_code" required>

    <button class="btn" type="submit">
        Вступить
    </button>
</form>
{% endblock %}
