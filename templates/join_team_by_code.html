{% extends "base.html" %}

{% block content %}
<div class="page-shell page-shell--narrow">
    <div class="page-top page-top--compact">
        <div>
            <span class="section-eyebrow">{{ hackathon.title }}</span>
            <h1 class="section-title">Вступить по invite code</h1>
            <p class="page-lead">Введите код, который передал капитан команды.</p>
        </div>
        <a class="btn btn-ghost" href="{% url 'hackathon_detail' hackathon.id %}">← К хакатону</a>
    </div>

    <form method="post" class="form panel-form">
        {% csrf_token %}
        <label for="invite_code">Invite code</label>
        <input type="text" id="invite_code" name="invite_code" placeholder="Например: ABC123" required>
        <div class="form-actions">
            <button class="btn btn-primary" type="submit">Вступить</button>
        </div>
    </form>
</div>
{% endblock %}
